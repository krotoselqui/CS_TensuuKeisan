name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and check (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
      - name: Check project source registration and document links
        run: ./scripts/Check-Repository.ps1
      - name: Build .NET Framework application
        run: |
          msbuild MahjongScoreTrainer.sln /t:Rebuild /p:Configuration=${{ matrix.configuration }} /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run scoring and tile regression checks
        run: ./scripts/Test-Regression.ps1 -Configuration ${{ matrix.configuration }}
